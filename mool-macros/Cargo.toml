[package]
name = "mool-macros"
version = "0.1.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Derive macros for the Mool database toolkit"

[lib]
proc-macro = true

[features]
default = []
text-search = ["mool-macros-impl/text-search"]
fuzzy-search = ["mool-macros-impl/fuzzy-search"]
vector = ["mool-macros-impl/vector"]

[dependencies]
mool-macros-impl = { path = "../mool-macros-impl", version = "0.1.9" }
proc-macro-crate = "3.2"
proc-macro2.workspace = true
quote.workspace = true
