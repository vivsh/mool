name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * 1"

permissions:
  contents: read

jobs:
  backends:
    name: ${{ matrix.backend }} tests and contracts (Rust 1.94)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            features: postgres time migrations tracing test-support text-search fuzzy-search vector
          - backend: sqlite
            features: sqlite time migrations test-support text-search fuzzy-search vector
          - backend: mysql
            features: mysql time test-support text-search
          - backend: mariadb
            features: mariadb time test-support text-search vector
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test backend and optional capabilities
        run: cargo test --locked --workspace --no-default-features --features "${{ matrix.features }}"
      - name: Check backend warnings
        run: cargo clippy --locked -p mool --all-targets --no-deps --no-default-features --features "${{ matrix.features }}" -- -D warnings
      - name: Check compiler-pinned macro contracts
        run: cargo test --locked -p mool --no-default-features --features "${{ matrix.features }} compile-contracts" --test trybuild
      - name: Check disabled optional capabilities
        if: matrix.backend == 'postgres'
        run: cargo test --locked -p mool --no-default-features --features "postgres compile-contracts" --test trybuild

  quality:
    name: Formatting, docs, and feature boundaries
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Registry dependency graph
        run: bash scripts/release-dependency-check.sh
      - name: Backendless and unavailable-feature contracts
        run: bash scripts/feature-contracts.sh
      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p mool --no-deps --no-default-features --features "postgres migrations time text-search fuzzy-search vector"
      - name: Public examples
        run: cargo check --locked -p mool --examples --no-default-features --features "postgres migrations mock time"
      - name: Macro crate warnings
        run: cargo clippy --locked -p mool-macros-impl -p mool-macros --all-targets --all-features -- -D warnings

  advisories:
    name: RustSec advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.94.0"
          arguments: --locked --all-features
          command: check advisories

  sqlite-live:
    name: Live SQLite
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run live SQLite behavior
        run: scripts/integration-tests.sh sqlite all

  server-live:
    name: Live ${{ matrix.backend }} ${{ matrix.version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            version: "15"
            image: postgres:15
            port: 5432
            health: pg_isready -U postgres
            url: postgres://postgres:postgres@localhost:5432/mool_tests
          - backend: postgres
            version: "18"
            image: postgres:18
            port: 5432
            health: pg_isready -U postgres
            url: postgres://postgres:postgres@localhost:5432/mool_tests
          - backend: mysql
            version: "8.0"
            image: mysql:8.0
            port: 3306
            health: mysqladmin ping -h localhost -proot
            url: mysql://root:root@localhost:3306/mool_tests
          - backend: mysql
            version: "8.4"
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h localhost -proot
            url: mysql://root:root@localhost:3306/mool_tests
          - backend: mariadb
            version: "10.11"
            image: mariadb:10.11
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            url: mysql://root:root@localhost:3306/mool_tests
          - backend: mariadb
            version: "11.8"
            image: mariadb:11.8
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            url: mysql://root:root@localhost:3306/mool_tests
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mool_tests
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mool_tests
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mool_tests
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run live backend behavior
        env:
          DATABASE_URL: ${{ matrix.url }}
        run: scripts/integration-tests.sh "${{ matrix.backend }}" all
