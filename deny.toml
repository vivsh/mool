[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "Maintenance notice for the supported chrono API and SQLx integration; revisit when chrono support changes." },
    { id = "RUSTSEC-2024-0449", reason = "Maintenance notice for Gaman's serde_yaml parser; revisit when the schema and migration YAML implementation changes." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
